<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Page not found | Fluid Fancy Fibre LLP</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-condensed-latin-600.woff2" crossorigin />
    <style>
      :root { color-scheme: light; --paper: #f4f0e8; --ink: #17140f; --body: #55503f; --accent: #8c7c5e; --line: rgba(140,124,94,.3); }
      @font-face { font-family: Barlow; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/barlow-latin-400.woff2") format("woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url("/fonts/barlow-condensed-latin-600.woff2") format("woff2"); }
      @font-face { font-family: "Barlow Fallback"; src: local("Arial"); size-adjust: 98%; ascent-override: 95%; descent-override: 24%; line-gap-override: 0%; }
      @font-face { font-family: "Barlow Condensed Fallback"; src: local("Arial Narrow"), local("Arial"); size-adjust: 82%; ascent-override: 95%; descent-override: 24%; line-gap-override: 0%; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: Barlow, "Barlow Fallback", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: min(100%, 680px); padding: clamp(28px, 7vw, 64px); border: 1px solid var(--line); text-align: center; }
      .kicker { color: var(--accent); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; }
      h1 { margin: 14px 0; font: 600 clamp(46px, 9vw, 76px)/.98 "Barlow Condensed", "Barlow Condensed Fallback", "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; }
      p { color: var(--body); font-size: 16px; line-height: 1.7; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 18px; padding: 0 28px; background: var(--ink); color: var(--paper); font-size: 11px; letter-spacing: .2em; text-decoration: none; text-transform: uppercase; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">Fluid Fancy Fibre</div>
      <h1>Page not found</h1>
      <p>This page may have moved. Head back to the home page to explore our yarns and services.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
